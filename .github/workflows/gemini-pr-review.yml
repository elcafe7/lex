name: Gemini PR review

on:
  # Fork PRs do not receive Actions secrets. This job never checks out or
  # executes pull-request code.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: gemini-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review pull request
    # Comment permissions are scoped to this one job. The reviewer cannot push,
    # merge, deploy, change Actions settings, or access a deployment host.
    permissions:
      issues: write
      pull-requests: write
    # The repository is public, so make invocation owner-only as well as
    # excluding forks. A review is paid and happens only after the explicit
    # review-this label is added by elcafe7.
    if: >-
      github.event.label.name == 'review-this' &&
      github.event.sender.login == 'elcafe7' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Review this pull request with Gemini
        uses: the-pr-agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: gemini/gemini-4-hydrogen
          config.fallback_models: '[]'
          # Keep review calls at Gemini's LOW reasoning level. Google bills
          # thinking as output tokens.
          config.reasoning_effort: 'low'
          # Hydrogen has a 1,048,576-token input limit. This explicit value is
          # required because the action's bundled LiteLLM metadata predates it.
          config.custom_model_max_tokens: '1048576'
          config.max_model_tokens: '1048576'
          config.output_run_details: 'true'
          config.output_run_cost: 'true'
          github_action_config.auto_review: 'true'
          github_action_config.pr_actions: '["labeled"]'
          github_action_config.fail_on_command_errors: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          pr_reviewer.extra_instructions: >-
            Review only. Identify concrete regressions, security-boundary errors,
            unsafe data handling, missing failure paths, CLI contract breaks, and
            inadequate tests. Cite changed lines and repository evidence. Do not
            propose automatic code changes, run deployments, approve, request
            changes, merge, publish releases, or alter repository settings.
      - name: Add rate-backed Gemini cost estimate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const h = {Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`};
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.PR_NUMBER}/comments`;
          const cs = await (await fetch(`${url}?per_page=100`,{headers:h})).json();
          const c = cs.filter(x=>x.body?.includes('<!-- pr-agent:review:full -->')).sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0];
          const m = c?.body.match(/- Tokens: ([\d,]+) in \/ ([\d,]+) out/);
          if (!m) process.exit(0);
          const cost = Number(m[1].replaceAll(',',''))*1.5e-6 + Number(m[2].replaceAll(',',''))*7.5e-6;
          const line = `- Estimated API cost: $${cost.toFixed(4)} (Gemini 4 Hydrogen Standard; LOW reasoning, non-cached)`;
          const body = c.body.replace(/- Estimated API cost:.*$/m,line);
          await fetch(`${url}/${c.id}`,{method:'PATCH',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({body})});
          NODE
