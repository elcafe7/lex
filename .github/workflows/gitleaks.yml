# Secret scan for Lex with the gitleaks CLI (MIT; not the licensed
# gitleaks-action). GitHub secret scanning and push protection are already
# on for this public repository; this is the complementary CI gate
# (security roadmap tool 3).
#
# - pull_request: scans only the PR's commits (merge-base side ^1 .. PR head ^2
#   of the merge commit), with just enough history fetched for that range.
# - push to main, weekly schedule, workflow_dispatch: scans the full history.
# The same full-history scan is a blocking gate in release.yml (in parallel
# with build-scan and Bandit). Findings fail the run. Output is always
# --redact'ed: logs, JSON and SARIF never contain secret values. Reports are
# kept as an artifact. Proven false positives only: add an [[allowlists]]
# entry in .gitleaks.toml with a reason, reviewed in the PR.
#
# Free tools only. Every action is pinned to a full commit SHA.
name: Gitleaks (secret scan)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "53 7 * * 1" # Mondays 07:53 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from that release's checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: History depth for the PR range
        id: depth
        if: github.event_name == 'pull_request'
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          [[ "${PR_COMMITS}" =~ ^[0-9]+$ ]] || { echo "::error::bad commit count"; exit 1; }
          echo "depth=$((PR_COMMITS + 2))" >> "${GITHUB_OUTPUT}"

      - name: Check out the PR merge commit (PR commits + 2 levels of history)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit, its two parents and every PR commit are within
          # commits + 2 generations. Extra history only widens the scan.
          fetch-depth: ${{ steps.depth.outputs.depth }}

      - name: Check out the full history
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # 1. The release's checksums file must list the hardcoded hash.
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" checksums.txt
          # 2. The download must match it.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Self-test the Gitleaks gate
        run: python3 -m unittest -v tests.test_gitleaks_gate

      - name: Choose the commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # HEAD is the merge commit: ^1 = base branch tip, ^2 = PR head.
            base=$(git rev-parse HEAD^1)
            head=$(git rev-parse HEAD^2)
            echo "GITLEAKS_LOG_OPTS=${base}..${head}" >> "${GITHUB_ENV}"
          else
            echo "GITLEAKS_LOG_OPTS=--all" >> "${GITHUB_ENV}"
          fi

      - name: Scan (redacted; fails on findings)
        env:
          REPO: ${{ github.repository }}
        run: |
          set +e
          bash scripts/gitleaks_check.sh gitleaks-report
          rc=$?
          set -e
          if [ -f gitleaks-report/gitleaks.md ]; then cat gitleaks-report/gitleaks.md >> "${GITHUB_STEP_SUMMARY}"; fi
          exit "$rc"

      - name: Keep the redacted report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: |
            gitleaks-report/
          if-no-files-found: warn
          retention-days: 90
