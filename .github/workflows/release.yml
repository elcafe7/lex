# Release verification for the Lex CLI.
#
# Tag push (v*): build the release archive with scripts/build_npm_release.sh
# (same lex-v<VERSION>.tar.gz + .sha256 that @n8te_/lex-cli downloads),
# resolve the Python dependencies into a lockfile in a clean venv, then the
# checks below.
#
# Order of checks (nothing is published unless every one passes):
#   1. build-scan: build, SBOM (syft), OSV-Scanner + scripts/osv_gate.py
#      (fails on CVSS >= 7.0; lower scored findings also hold the release;
#      unscored advisories are ::warning:: only), SHA256SUMS written and
#      verified.
#   2. bandit: Bandit (Python static analysis) over the repo's Python code,
#      installed from the hash-pinned .github/requirements/bandit-requirements.txt.
#      Any medium or high severity finding (any confidence), or a scan that
#      could not finish, fails the job and blocks the release. No baseline;
#      proven false positives carry an inline "# nosec BXXX  # reason: ...".
#      Runs in parallel with build-scan; also runs on PRs, pushes to main
#      and weekly via bandit.yml.
#   3. gitleaks: Gitleaks secret scan (CLI 8.30.1, checksum-verified) over
#      the full git history, always --redact'ed. Any finding, or a scan that
#      could not finish, fails the job and blocks the release. No baseline;
#      proven false positives go in .gitleaks.toml with a reason. Runs in
#      parallel with build-scan and bandit; also runs on PRs, pushes to main
#      and weekly via gitleaks.yml.
#   4. virustotal: optional, only if vars.ENABLE_VIRUSTOTAL == 'true' AND the
#      VT_API_KEY secret is set, and only on a public repo.
#   5. release: re-verifies SHA256SUMS, attests, publishes the release with
#      the scan report and verification.json (badge data).
#   6. security-report-commit: after a clean publish only, commits the
#      run's report folder security/reports/<tag>_<UTC timestamp>/ (OSV,
#      Bandit, Gitleaks, SBOM, SHA256SUMS, attestation link, VirusTotal links, Scorecard JSON,
#      summary.md) plus security/README.md, security/latest.json and the
#      README "Security reports" block, with [skip ci], on a reports/<tag>_<ts>
#      branch and opens a PR to the default branch (never pushes to it).
#      Blocked runs keep their report as a workflow artifact only.
# If any check fails: nothing is published. Findings go to a workflow
# artifact and the job summary, and the "blocked" job opens or updates the
# issue "Release blocked: <tag> security check failed" (assigned to elcafe7)
# with the findings and a fix prompt. A later clean run publishes and closes it.
#
# workflow_dispatch: dry run of steps 1–3 only (build-scan, bandit, gitleaks).
# Never attests, publishes or opens issues.
#
# Free tools only. Every action is pinned to a full commit SHA.
name: Release (verified)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "v1.55.0"
  OSV_SCANNER_VERSION: "v2.7.0"
  # sha256 of osv-scanner_linux_amd64 from the v2.7.0 release's osv-scanner_SHA256SUMS
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  # CVSS score at or above which the release fails (7.0 = High, 9.0 = Critical)
  SEVERITY_THRESHOLD: "7.0"
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from that release's checksums file
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  build-scan:
    name: Build, SBOM, scan, checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prefix: ${{ steps.meta.outputs.prefix }}
      gate: ${{ steps.scan.outputs.gate }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version and check the tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          m = re.search(r'^version\s*=\s*"([^"]+)"$', Path("pyproject.toml").read_text(), re.M)
          if not m:
              raise SystemExit("Could not read version from pyproject.toml")
          print(m.group(1))
          PY
          )"
          tag="v${version}"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match pyproject.toml version $version (expected $tag)"
            exit 1
          fi
          npm_tag="$(python3 -c 'import json;print(json.load(open("npm/lex-cli/package.json"))["lexCli"]["releaseTag"])')"
          if [ "$npm_tag" != "$tag" ]; then
            echo "::warning::npm/lex-cli/package.json lexCli.releaseTag is $npm_tag, not $tag"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "title=Lex $tag"
            echo "prefix=lex-$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build release archive (scripts/build_npm_release.sh)
        run: ./scripts/build_npm_release.sh dist

      - name: Resolve Python dependencies into a lockfile (clean venv)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The repo has no committed lockfile (requirements.txt/pyproject are
          # unpinned), so record exactly what `pip install .` resolves today.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet .
          "$RUNNER_TEMP/venv/bin/python" -m pip freeze --exclude lex-bible \
            > "dist/lex-v${VERSION}-requirements.lock.txt"
          cat "dist/lex-v${VERSION}-requirements.lock.txt"
          echo "OSV_LOCKFILES=requirements.txt:dist/lex-v${VERSION}-requirements.lock.txt" >> "$GITHUB_ENV"

      - name: Stage SBOM input (archive contents + resolved lockfile)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-root"
          tar -xzf "dist/lex-v${VERSION}.tar.gz" -C "$RUNNER_TEMP/sbom-root"
          cp "dist/lex-v${VERSION}-requirements.lock.txt" \
            "$RUNNER_TEMP/sbom-root/lex-${VERSION}/requirements.lock.txt"
          echo "SBOM_ROOT=$RUNNER_TEMP/sbom-root/lex-${VERSION}" >> "$GITHUB_ENV"

      - name: Release notes intro (CHANGELOG section)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p notes
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v; next} p' CHANGELOG.md > notes/intro.md
          [ -s notes/intro.md ] || echo "Lex v${VERSION}." > notes/intro.md

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.SBOM_ROOT }}
          format: cyclonedx-json
          output-file: dist/${{ steps.meta.outputs.prefix }}.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Self-test the OSV severity gate
        run: python3 -m unittest -v tests.test_osv_gate

      - name: Install OSV-Scanner (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Scan with OSV-Scanner and gate on the result
        id: scan
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p scan-report
          args=()
          for lock in $OSV_LOCKFILES; do args+=(-L "$lock"); done
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}" -L "dist/${PREFIX}.cdx.json" \
            --format json --output-file "dist/${PREFIX}-osv-scan.json"
          rc=$?
          set -e
          # 0 = no vulns, 1 = vulns found (gated below), anything else = scanner error
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::OSV-Scanner failed with exit code $rc"
            exit "$rc"
          fi
          python3 scripts/osv_gate.py \
            "dist/${PREFIX}-osv-scan.json" \
            "dist/${PREFIX}-osv-scan.md" \
            --threshold "$SEVERITY_THRESHOLD" \
            --title "${PREFIX} OSV-Scanner report" \
            --badge-json dist/verification.json \
            --report-url "${SERVER_URL}/${REPO}/releases/download/${TAG}/${PREFIX}-osv-scan.md" \
            --tool-version "${OSV_SCANNER_VERSION#v}" \
            --release "$TAG" \
            --repository "$REPO" && gate=pass || gate=fail
          cp "dist/${PREFIX}-osv-scan.json" "dist/${PREFIX}-osv-scan.md" scan-report/
          cat "dist/${PREFIX}-osv-scan.md" >> "$GITHUB_STEP_SUMMARY"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Write and verify SHA256SUMS
        if: steps.scan.outputs.gate == 'pass'
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Keep the scan report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report
          path: scan-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep release files as a workflow artifact (clean scan only)
        if: steps.scan.outputs.gate == 'pass'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Keep release notes as a workflow artifact
        if: steps.scan.outputs.gate == 'pass'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error
          retention-days: 14

      - name: Stop on findings (nothing is published)
        if: steps.scan.outputs.gate != 'pass'
        run: |
          echo "::error::OSV-Scanner found vulnerabilities. Nothing will be published. See the job summary (Suggested fix) and the scan-report artifact."
          exit 1


  bandit:
    name: Bandit (Python static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      gate: ${{ steps.bandit.outputs.gate }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/bandit-venv"
          "$RUNNER_TEMP/bandit-venv/bin/python" -m pip install --quiet --require-hashes --no-deps \
            -r .github/requirements/bandit-requirements.txt
          "$RUNNER_TEMP/bandit-venv/bin/bandit" --version

      - name: Self-test the Bandit gate
        run: python3 -m unittest -v tests.test_bandit_gate

      # Any medium/high finding or an incomplete scan fails this job, so the
      # release job below never runs and the blocked job opens the issue with
      # bandit.md (no source lines). bandit.json/.txt stay in the artifact.
      - name: Scan with Bandit and gate on the result
        id: bandit
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          PATH="$RUNNER_TEMP/bandit-venv/bin:$PATH" bash scripts/bandit_check.sh bandit-report
          rc=$?
          set -e
          if [ -f bandit-report/bandit.md ]; then cat bandit-report/bandit.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -eq 0 ]; then echo "gate=pass" >> "$GITHUB_OUTPUT"; else echo "gate=fail" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Keep the Bandit report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report/
          if-no-files-found: ignore
          retention-days: 30


  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      gate: ${{ steps.gitleaks.outputs.gate }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" checksums.txt
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Self-test the Gitleaks gate
        run: python3 -m unittest -v tests.test_gitleaks_gate

      # Any finding or an incomplete scan fails this job, so the release job
      # below never runs and the blocked job opens the issue with gitleaks.md
      # (values redacted). gitleaks.json/.sarif stay in the artifact.
      - name: Scan the full history (redacted) and gate on the result
        id: gitleaks
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
          GITLEAKS_LOG_OPTS: "--all"
        run: |
          set +e
          bash scripts/gitleaks_check.sh gitleaks-report
          rc=$?
          set -e
          if [ -f gitleaks-report/gitleaks.md ]; then cat gitleaks-report/gitleaks.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" -eq 0 ]; then echo "gate=pass" >> "$GITHUB_OUTPUT"; else echo "gate=fail" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Keep the redacted Gitleaks report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report/
          if-no-files-found: ignore
          retention-days: 30

  virustotal:
    name: VirusTotal (optional)
    needs: build-scan
    if: github.event_name == 'push' && vars.ENABLE_VIRUSTOTAL == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.vt.outputs.ran }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Public files only: this job runs only on a public repo, and only on
      # the files that the release below would publish.
      - name: Scan with VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          mkdir -p vt-report
          echo "ran=false" >> "$GITHUB_OUTPUT"
          # ENABLE_VIRUSTOTAL is 'true' (this job's if:), so a missing key is
          # a failed check, not "VT off": fail closed, publish nothing, and let
          # the blocked job open or update the "Release blocked" issue.
          if [ -z "$VT_API_KEY" ]; then
            echo "::error title=VirusTotal::ENABLE_VIRUSTOTAL is 'true' but the VT_API_KEY secret is not set. No file was scanned and nothing will be published."
            bash scripts/virustotal_not_run.sh vt-report/virustotal-not-run.md missing-key
            cat vt-report/virustotal-not-run.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set +e
          bash scripts/virustotal_check.sh vt-report/virustotal.md dist/lex-v*.tar.gz
          rc=$?
          set -e
          if [ -f vt-report/virustotal.md ]; then cat vt-report/virustotal.md >> "$GITHUB_STEP_SUMMARY"; fi
          # ran=true only after a scan that finished with results and passed.
          if [ "$rc" -eq 0 ]; then echo "ran=true" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Keep the VirusTotal report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-report
          path: vt-report/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Attest and publish
    needs: [build-scan, bandit, gitleaks, virustotal]
    # Bandit and Gitleaks guards: publish only if both jobs passed (gate == pass).
    # VirusTotal guard: publish only if the VT job passed, or was skipped
    # because VT is off (ENABLE_VIRUSTOTAL unset or repo not public). An
    # enabled VT job that fails, is cancelled or is skipped for any other
    # reason never publishes.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.build-scan.result == 'success' && needs.build-scan.outputs.gate == 'pass' &&
      needs.bandit.result == 'success' && needs.bandit.outputs.gate == 'pass' &&
      needs.gitleaks.result == 'success' && needs.gitleaks.outputs.gate == 'pass' &&
      (needs.virustotal.result == 'success' ||
       (needs.virustotal.result == 'skipped' &&
        !(vars.ENABLE_VIRUSTOTAL == 'true' && github.event.repository.visibility == 'public')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # Sigstore signing for attestations
      attestations: write  # store attestations
      issues: write        # close a matching "Release blocked" issue
    env:
      TAG: ${{ needs.build-scan.outputs.tag }}
      TITLE: ${{ needs.build-scan.outputs.title }}
      PREFIX: ${{ needs.build-scan.outputs.prefix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Re-verify SHA256SUMS before publishing
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Check the scan passed and the badge data says so
        run: |
          test -f dist/verification.json
          jq -e '.result == "pass" and .known_vulnerabilities == 0' dist/verification.json

      # Artifact attestations are free on public repos. On a private repo
      # they need GitHub Enterprise Cloud; set vars.ATTESTATIONS_AVAILABLE
      # to 'true' only if that applies.
      - name: Attest build provenance
        id: attest
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest SBOM
        id: attest-sbom
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lex-v*.tar.gz
          sbom-path: dist/${{ env.PREFIX }}.cdx.json

      # Signed-release files (OpenSSF Scorecard "Signed-Releases"): the
      # Sigstore bundles from the two attest steps, attached as release
      # assets so a download can be checked offline with
      # `gh attestation verify <file> -R <repo> --bundle <bundle>`.
      # They are made after SHA256SUMS was written and attested, so they
      # are not listed in it (adding them would change the attested
      # SHA256SUMS); each bundle is signed and verifies on its own.
      - name: Stage attestation bundles as release assets
        if: steps.attest.outcome == 'success'
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          mkdir -p bundles
          test -s "$PROVENANCE_BUNDLE"
          jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "$PROVENANCE_BUNDLE" >/dev/null
          cp -- "$PROVENANCE_BUNDLE" "bundles/${PREFIX}.intoto.jsonl"
          if [ -n "$SBOM_BUNDLE" ] && [ -s "$SBOM_BUNDLE" ]; then
            jq -e '.mediaType | startswith("application/vnd.dev.sigstore.bundle")' "$SBOM_BUNDLE" >/dev/null
            cp -- "$SBOM_BUNDLE" "bundles/${PREFIX}.sbom.sigstore.json"
          fi
          ls -l bundles

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VT_RAN: ${{ needs.virustotal.outputs.ran }}
          ATTESTED: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true' }}
        run: |
          {
            cat notes/intro.md
            echo
            echo "## Verification"
            echo
            echo "Built and scanned by [this workflow run](${RUN_URL}) on $(jq -r .date dist/verification.json): OSV-Scanner $(jq -r .tool_version dist/verification.json), 0 known vulnerabilities."
            echo
            echo "- \`SHA256SUMS\`: checksums for every file in this release (\`sha256sum -c --ignore-missing SHA256SUMS\`)"
            echo "- \`${PREFIX}.cdx.json\`: CycloneDX SBOM"
            echo "- \`${PREFIX}-osv-scan.json\` / \`.md\`: OSV-Scanner report for the date above"
            echo "- \`verification.json\`: scan summary (tool, date, result, report link) for download pages"
            echo "- Bandit: 0 medium or high severity findings in the Python source (report in the security report for this release)"
            if [ "$ATTESTED" = "true" ]; then
              echo "- Provenance: \`gh attestation verify <file> -R ${REPO}\`"
            fi
            if [ -f "bundles/${PREFIX}.intoto.jsonl" ]; then
              echo "- \`${PREFIX}.intoto.jsonl\`: signed build-provenance bundle (Sigstore) for every file above; offline check: \`gh attestation verify ${PREFIX}.tar.gz -R ${REPO} --bundle ${PREFIX}.intoto.jsonl\`"
            fi
            if [ -f "bundles/${PREFIX}.sbom.sigstore.json" ]; then
              echo "- \`${PREFIX}.sbom.sigstore.json\`: signed SBOM attestation bundle for \`${PREFIX}.tar.gz\`"
            fi
            if [ "$VT_RAN" = "true" ]; then
              echo "- VirusTotal: checked before publishing (links in the workflow run summary)"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/* bundles/*)
          gh release create "$TAG" "${files[@]}" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Close any "Release blocked" issue for this tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/release_unblocked.sh "$TAG"

      # Security report for this run (passed to security-report-commit as an
      # artifact). The release is already out, so these steps never fail it.
      - name: Fetch the published OpenSSF Scorecard result
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: |
          curl -fsS --max-time 30 -o "$RUNNER_TEMP/scorecard.json" \
            "https://api.scorecard.dev/projects/github.com/${REPO}" \
            || { rm -f "$RUNNER_TEMP/scorecard.json"; echo "::warning::Scorecard result not available"; }

      - name: Download the Bandit report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bandit-report
          path: bandit-report

      - name: Download the Gitleaks report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report

      - name: Download the VirusTotal report
        if: needs.virustotal.outputs.ran == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: virustotal-report
          path: vt-report

      - name: Write the security report
        id: report
        continue-on-error: true
        env:
          STATUS: published
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIST_DIR: dist
          BANDIT_DIR: bandit-report
          GITLEAKS_DIR: gitleaks-report
          VT_DIR: vt-report
          ATTESTED: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true' }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SOCKET_URL: ${{ vars.SOCKET_URL }}
          BESTPRACTICES_PROJECT_ID: ${{ vars.BESTPRACTICES_PROJECT_ID }}
        run: |
          SCORECARD_FILE="$RUNNER_TEMP/scorecard.json" \
            bash scripts/write_security_report.sh "$RUNNER_TEMP/security-report"
          cat "$RUNNER_TEMP"/security-report/*/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the security report as a workflow artifact
        if: steps.report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: ${{ runner.temp }}/security-report/
          if-no-files-found: error
          retention-days: 90

  security-report-commit:
    name: Commit security report
    needs: [build-scan, bandit, gitleaks, virustotal, release]
    # Clean publish only (needs: release succeeded). Nothing else runs here.
    # !cancelled() is needed: without a status function GitHub skips this job
    # whenever a transitive dependency (the optional virustotal job) is skipped,
    # even though release itself succeeded (seen on v2.6.8, run 42702865665).
    # The VirusTotal, Bandit and Gitleaks guards repeat the release job's, so
    # this job can never run after a failed check even if the release condition changes.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.build-scan.result == 'success' && needs.release.result == 'success' &&
      needs.bandit.result == 'success' && needs.bandit.outputs.gate == 'pass' &&
      needs.gitleaks.result == 'success' && needs.gitleaks.outputs.gate == 'pass' &&
      (needs.virustotal.result == 'success' ||
       (needs.virustotal.result == 'skipped' &&
        !(vars.ENABLE_VIRUSTOTAL == 'true' && github.event.repository.visibility == 'public')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # push the reports/<tag>_<ts> branch (never the default branch)
      pull-requests: write  # open the PR to the default branch
    concurrency:
      group: security-reports-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the security report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-report
          path: ${{ runner.temp }}/security-report

      - name: Open a PR with the report ([skip ci])
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-scan.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: bash scripts/commit_security_report.sh "$RUNNER_TEMP/security-report"

  blocked:
    name: Report blocked release
    needs: [build-scan, bandit, gitleaks, virustotal, release]
    if: >-
      always() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || needs.build-scan.outputs.gate == 'fail' ||
       needs.bandit.outputs.gate == 'fail' || needs.gitleaks.outputs.gate == 'fail')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write  # open or update the "Release blocked" issue
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "*-report"
          path: reports
          merge-multiple: true

      - name: Open or update the "Release blocked" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Prefer the validated build-scan tag; fall back to ref_name (script allowlists).
          TAG: ${{ needs.build-scan.outputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: "build-scan: ${{ needs.build-scan.result }} (scan ${{ needs.build-scan.outputs.gate || 'not run' }}), bandit: ${{ needs.bandit.result }} (gate ${{ needs.bandit.outputs.gate || 'not run' }}), gitleaks: ${{ needs.gitleaks.result }} (gate ${{ needs.gitleaks.outputs.gate || 'not run' }}), virustotal: ${{ needs.virustotal.result }}, release: ${{ needs.release.result }}"
        run: |
          mkdir -p reports
          rm -f reports/*.json
          bash scripts/release_blocked_issue.sh "$TAG" reports

      # Blocked runs: the report is a workflow artifact only. Nothing is committed.
      - name: Download reports for the security report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-report"
          path: report-inputs
          merge-multiple: true

      - name: Write the security report (artifact only)
        id: report
        continue-on-error: true
        env:
          STATUS: blocked
          TAG: ${{ needs.build-scan.outputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_DIR: report-inputs
          BANDIT_DIR: report-inputs
          GITLEAKS_DIR: report-inputs
          VT_DIR: report-inputs
        run: |
          bash scripts/write_security_report.sh "$RUNNER_TEMP/security-report"
          cat "$RUNNER_TEMP"/security-report/*/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the security report as a workflow artifact
        if: steps.report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-blocked
          path: ${{ runner.temp }}/security-report/
          if-no-files-found: error
          retention-days: 30
