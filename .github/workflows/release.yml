# Release verification for the Lex CLI.
#
# Tag push (v*): build the release archive the same way as
# scripts/build_npm_release.sh, generate a CycloneDX SBOM, scan with
# OSV-Scanner (fails on High/Critical), write SHA256SUMS, add GitHub
# artifact attestations, and publish the GitHub release with everything
# attached.
#
# workflow_dispatch: dry run. Runs build + SBOM + scan + checksums and keeps
# the files as a workflow artifact. It never attests or publishes anything.
#
# Free tools only. Every action is pinned to a full commit SHA.
name: Release (verified)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  SYFT_VERSION: "v1.55.0"
  OSV_SCANNER_VERSION: "v2.7.0"
  # sha256 of osv-scanner_linux_amd64 from the v2.7.0 release's osv-scanner_SHA256SUMS
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  # CVSS score at or above which the release fails (7.0 = High, 9.0 = Critical)
  SEVERITY_THRESHOLD: "7.0"

jobs:
  build-scan:
    name: Build, SBOM, scan, checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version and check the tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          m = re.search(r'^version\s*=\s*"([^"]+)"$', Path("pyproject.toml").read_text(), re.M)
          if not m:
              raise SystemExit("Could not read version from pyproject.toml")
          print(m.group(1))
          PY
          )"
          tag="v${version}"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match pyproject.toml version $version (expected $tag)"
            exit 1
          fi
          npm_tag="$(python3 -c 'import json;print(json.load(open("npm/lex-cli/package.json"))["lexCli"]["releaseTag"])')"
          if [ "$npm_tag" != "$tag" ]; then
            echo "::warning::npm/lex-cli/package.json lexCli.releaseTag is $npm_tag, not $tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release archive (scripts/build_npm_release.sh)
        run: ./scripts/build_npm_release.sh dist

      - name: Resolve Python dependencies into a lockfile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The repo has no lockfile (requirements.txt/pyproject are unpinned),
          # so record exactly what `pip install .` resolves today.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet .
          "$RUNNER_TEMP/venv/bin/python" -m pip freeze --exclude lex-bible \
            > "dist/lex-v${VERSION}-requirements.lock.txt"
          cat "dist/lex-v${VERSION}-requirements.lock.txt"

      - name: Stage SBOM input (archive contents + resolved lockfile)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-root"
          tar -xzf "dist/lex-v${VERSION}.tar.gz" -C "$RUNNER_TEMP/sbom-root"
          cp "dist/lex-v${VERSION}-requirements.lock.txt" \
            "$RUNNER_TEMP/sbom-root/lex-${VERSION}/requirements.lock.txt"
          echo "SBOM_ROOT=$RUNNER_TEMP/sbom-root/lex-${VERSION}" >> "$GITHUB_ENV"

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.SBOM_ROOT }}
          format: cyclonedx-json
          output-file: dist/lex-v${{ steps.version.outputs.version }}.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Self-test the OSV severity gate
        run: python3 -m unittest -v tests.test_osv_gate

      - name: Install OSV-Scanner (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Scan lockfile and SBOM with OSV-Scanner
        id: scan
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source \
            -L "requirements.txt:dist/lex-v${VERSION}-requirements.lock.txt" \
            -L "dist/lex-v${VERSION}.cdx.json" \
            --format json --output-file "dist/lex-v${VERSION}-osv-scan.json"
          rc=$?
          set -e
          # 0 = no vulns, 1 = vulns found (gated below by severity), anything else = scanner error
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::OSV-Scanner failed with exit code $rc"
            exit "$rc"
          fi
          python3 scripts/osv_gate.py \
            "dist/lex-v${VERSION}-osv-scan.json" \
            "dist/lex-v${VERSION}-osv-scan.md" \
            --threshold "$SEVERITY_THRESHOLD" \
            --title "Lex v${VERSION} OSV-Scanner report" && gate=pass || gate=fail
          cat "dist/lex-v${VERSION}-osv-scan.md" >> "$GITHUB_STEP_SUMMARY"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Keep release files as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Fail on High/Critical findings
        if: steps.scan.outputs.gate != 'pass'
        run: |
          echo "::error::OSV-Scanner found High/Critical vulnerabilities (CVSS >= ${SEVERITY_THRESHOLD}). See the job summary and the release-files artifact."
          exit 1

  release:
    name: Attest and publish
    needs: build-scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # Sigstore signing for attestations
      attestations: write  # store attestations
    env:
      VERSION: ${{ needs.build-scan.outputs.version }}
      TAG: ${{ needs.build-scan.outputs.tag }}
      HAS_VT_KEY: ${{ secrets.VT_API_KEY != '' }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Artifact attestations are free on public repos. On a private repo
      # they need GitHub Enterprise Cloud; set vars.ATTESTATIONS_AVAILABLE
      # to 'true' only if that applies.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/lex-v${{ env.VERSION }}.tar.gz
            dist/lex-v${{ env.VERSION }}.tar.gz.sha256
            dist/lex-v${{ env.VERSION }}.cdx.json
            dist/lex-v${{ env.VERSION }}-requirements.lock.txt
            dist/lex-v${{ env.VERSION }}-osv-scan.json
            dist/lex-v${{ env.VERSION }}-osv-scan.md
            dist/SHA256SUMS

      - name: Attest SBOM
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lex-v${{ env.VERSION }}.tar.gz
          sbom-path: dist/lex-v${{ env.VERSION }}.cdx.json

      # Optional and OFF by default. VirusTotal shares uploaded files with
      # its security partners; only enable for files that are already public.
      # Free public API: 4 requests/min, 500/day.
      - name: Upload archive to VirusTotal (optional)
        id: vt
        if: vars.ENABLE_VIRUSTOTAL == 'true' && env.HAS_VT_KEY == 'true'
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          file="dist/lex-v${VERSION}.tar.gz"
          sha="$(sha256sum "$file" | awk '{print $1}')"
          # Files over 32 MB need a one-time upload URL.
          upload_url="$(curl -fsS -H "x-apikey: ${VT_API_KEY}" \
            https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)"
          curl -fsS -H "x-apikey: ${VT_API_KEY}" -F "file=@${file}" "$upload_url" > /dev/null
          echo "url=https://www.virustotal.com/gui/file/${sha}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VT_URL: ${{ steps.vt.outputs.url }}
          ATTESTED: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true' }}
        run: |
          {
            echo "## Verification"
            echo
            echo "Built and scanned by [this workflow run](${RUN_URL}) on $(date -u '+%Y-%m-%d')."
            echo
            echo "- \`SHA256SUMS\`: checksums for every file in this release (\`sha256sum -c SHA256SUMS\`)"
            echo "- \`lex-v${VERSION}.cdx.json\`: CycloneDX SBOM"
            echo "- \`lex-v${VERSION}-requirements.lock.txt\`: Python packages resolved at build time"
            echo "- \`lex-v${VERSION}-osv-scan.json\` / \`.md\`: OSV-Scanner report for the date above"
            if [ "$ATTESTED" = "true" ]; then
              echo "- Provenance: \`gh attestation verify lex-v${VERSION}.tar.gz -R ${REPO}\`"
            fi
            if [ -n "$VT_URL" ]; then
              echo "- VirusTotal: ${VT_URL}"
            fi
            echo
            echo "### Scan summary"
            echo
            sed -n '3,7p' "dist/lex-v${VERSION}-osv-scan.md"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Lex ${TAG}" \
            --notes-file "$RUNNER_TEMP/notes.md"
