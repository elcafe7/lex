# OpenSSF Scorecard: weekly supply-chain checks for this public repo.
# Results go to the Security tab (code scanning) and, with publish_results,
# to api.scorecard.dev so the README badge can show the score.
# Every action is pinned to a full commit SHA (Dependabot keeps them current).
#
# Branch-Protection (issue #37): when the repo secret SCORECARD_TOKEN is set,
# Scorecard authenticates with it instead of the default GITHUB_TOKEN. It must
# be a fine-grained PAT limited to elcafe7/lex with only Administration:
# Read-only (plus the automatic Metadata: Read-only), so Scorecard can read
# the branch protection rules and ruleset settings. Without the secret the
# workflow falls back to GITHUB_TOKEN and still runs. Setup steps:
# security/MANUAL-STEPS.md; accepted gaps: docs/SCORECARD.md.
name: Scorecard

on:
  schedule:
    - cron: "23 9 * * 1"  # Mondays 09:23 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read       # check out the repo
      actions: read        # read workflow runs for the CI checks
      security-events: write  # upload SARIF to code scanning
      id-token: write         # publish results to api.scorecard.dev
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Read-only fine-grained PAT when configured, else the default token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Keep results as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
