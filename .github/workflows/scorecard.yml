# OpenSSF Scorecard: weekly supply-chain checks for this public repo.
# Results go to the Security tab (code scanning) and, with publish_results,
# to api.scorecard.dev so the README badge can show the score.
# Every action is pinned to a full commit SHA (Dependabot keeps them current).
name: Scorecard

on:
  schedule:
    - cron: "23 9 * * 1"  # Mondays 09:23 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write  # upload SARIF to code scanning
      id-token: write         # publish results to api.scorecard.dev
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep results as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
