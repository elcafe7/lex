# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# updates the commit SHA and the "# vX.Y.Z" version comment together.
#
# pip: only .github/requirements (hash-pinned CI tooling: Bandit). The app's
# own Python dependencies have no lockfile and are unpinned (or ">=" floors),
# so version-update PRs would have nothing to bump there. Vulnerable Python
# packages are still covered by Dependabot alerts (dependency graph) and by
# the OSV-Scanner gate in release.yml, which scans what `pip install .`
# resolves at release time.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
